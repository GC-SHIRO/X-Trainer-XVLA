# Configuration-stage baseline. The optional staged LoRA scheduler is not implemented yet.
# Replace all /path/to entries with paths on the training machine.
# Prefer absolute paths; relative paths resolve from the process working directory.
# Use lerobot-train directly for now: train_xvla.sh can override policy.path.
dataset:
  repo_id: xtrainer/xvla-v21
  root: /path/to/xtrainer-dataset
  format_version: v2.1
  streaming: false
  eval_split: 0.0

rename_map:
  observation.images.top: observation.images.image
  observation.images.left_wrist: observation.images.image2
  observation.images.right_wrist: observation.images.image3

policy:
  type: xvla
  # Original official checkpoint in a format supported by XVLAPolicy.from_pretrained.
  path: /path/to/original-xvla-checkpoint
  dtype: bfloat16
  action_mode: auto
  domain_id: 19
  chunk_size: 32
  n_action_steps: 32
  n_obs_steps: 1
  max_state_dim: 20
  max_action_dim: 20
  num_image_views: 3
  # Independent path: do not assume a tokenizer/ subdirectory exists in the base.
  tokenizer_name: /path/to/xvla-tokenizer
  # PEFT freezes base weights after model construction.
  freeze_vision_encoder: false
  freeze_language_encoder: false
  train_policy_transformer: true
  train_soft_prompts: true
  push_to_hub: false

peft:
  method_type: LORA
  r: 8
  lora_alpha: 16
  target_modules: all-linear
  # Maps to PEFT modules_to_save; these modules train in full.
  full_training_modules:
    - model.transformer.soft_prompt_hub
    - model.transformer.action_encoder
    - model.transformer.action_decoder
  # PeftConfig does not expose bias; LoraConfig's default is "none".

output_dir: outputs/train/xtrainer_xvla_lora
job_name: xtrainer_xvla_lora
batch_size: 8
steps: 30000
num_workers: 4
log_freq: 50
save_freq: 20000
env_eval_freq: 0
eval_steps: 0
use_policy_training_preset: false

optimizer:
  type: xvla-lora-adamw
  lr: 0.0001
  betas: [0.9, 0.99]
  eps: 0.00000001
  weight_decay: 0.0
  grad_clip_norm: 10.0
  vlm_lora_lr_scale: 1.0
  action_lora_lr_scale: 1.0
  soft_prompt_lr_scale: 1.0
  action_module_lr_scale: 1.0

scheduler:
  type: xvla-lora-staged
  num_warmup_steps: null
  lora_start_step: 1000
  use_cosine_decay: false
  num_decay_steps: null
  decay_lr_ratio: 0.025

wandb:
  enable: true

xtrainer:
  schema_version: 1
  dataset_format_version: v2.1
  xvla_domain_id: 19
  action_mode: auto
  observation_keys:
    state: observation.state
    images:
      top: observation.images.top
      left_wrist: observation.images.left_wrist
      right_wrist: observation.images.right_wrist
    task: task
  action_key: action
  state_action_order:
    - {index: 0, name: left_arm_joint_1, unit: rad}
    - {index: 1, name: left_arm_joint_2, unit: rad}
    - {index: 2, name: left_arm_joint_3, unit: rad}
    - {index: 3, name: left_arm_joint_4, unit: rad}
    - {index: 4, name: left_arm_joint_5, unit: rad}
    - {index: 5, name: left_arm_joint_6, unit: rad}
    - {index: 6, name: left_gripper, unit: normalized_0_1}
    - {index: 7, name: right_arm_joint_1, unit: rad}
    - {index: 8, name: right_arm_joint_2, unit: rad}
    - {index: 9, name: right_arm_joint_3, unit: rad}
    - {index: 10, name: right_arm_joint_4, unit: rad}
    - {index: 11, name: right_arm_joint_5, unit: rad}
    - {index: 12, name: right_arm_joint_6, unit: rad}
    - {index: 13, name: right_gripper, unit: normalized_0_1}
  cameras:
    top:
      serial: "409122273405"
      observation_key: observation.images.top
    left_wrist:
      serial: "412622272997"
      observation_key: observation.images.left_wrist
    right_wrist:
      serial: "412622271417"
      observation_key: observation.images.right_wrist
